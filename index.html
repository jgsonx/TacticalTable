<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vertical Soccer Tactics Animator</title>
  <style>
    body { 
      font-family: system-ui, sans-serif; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      background: #1a1a1a; 
      color: white; 
      padding: 20px; 
      margin: 0;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .header-bar {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 10px;
    }
    .team-selectors {
      display: flex;
      gap: 20px;
      margin-bottom: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .selector-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-weight: bold;
    }
    .selector-group.blue { color: #66b3ff; }
    .selector-group.red { color: #ff6666; }
    
    select {
      margin-top: 5px;
      padding: 6px 10px;
      font-size: 15px;
      border-radius: 5px;
      background: #333;
      color: white;
      border: 1px solid #555;
      cursor: pointer;
    }

    .canvas-container {
      width: 90vw;
      max-width: 700px;
      aspect-ratio: 50 / 65;
      position: relative;
    }

    canvas { 
      width: 100%;
      height: 100%;
      border: 2px solid #fff; 
      border-radius: 5px; 
      cursor: grab;
      touch-action: none; 
      background: #2E8B57; 
      display: block;
    }
    canvas:active { cursor: grabbing; }

    .controls { margin-top: 15px; display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; align-items: center; }
    .toggles { margin-top: 10px; display: flex; gap: 20px; font-size: 0.95em; color: #ddd; flex-wrap: wrap; justify-content: center; }
    label.toggle-label { display: flex; align-items: center; gap: 5px; cursor: pointer; color: white; font-weight: normal; }
    button { padding: 10px 15px; border: none; border-radius: 5px; background: #007bff; color: white; cursor: pointer; font-weight: bold; }
    button:hover { background: #0056b3; }
    button.recording { background: #dc3545; animation: pulse 1s infinite; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }
    #status { margin-top: 10px; font-size: 0.9em; color: #aaa; text-align: center; }
    .audio-alert { color: #ffeb3b; font-size: 0.8em; margin-top: 5px; text-align: center; }
  </style>
</head>
<body>

  <div class="header-bar">
    <h2>Tactical Board</h2>
    
    <div class="team-selectors">
      <div class="selector-group blue">
        Blue Team (Top)
        <select id="blueSelect">
          <option value="9v9_3_4_1" selected>9v9 (3-4-1)</option>
          <option value="9v9_3_3_2">9v9 (3-3-2)</option>
          <option value="9v9_2_4_2">9v9 (2-4-2)</option>
          <option value="7v7_2_3_1">7v7 (2-3-1)</option>
        </select>
      </div>
      
      <div class="selector-group red">
        Red Team (Bottom)
        <select id="redSelect">
          <option value="9v9_3_4_1" selected>9v9 (3-4-1)</option>
          <option value="9v9_3_3_2">9v9 (3-3-2)</option>
          <option value="9v9_2_4_2">9v9 (2-4-2)</option>
          <option value="7v7_2_3_1">7v7 (2-3-1)</option>
        </select>
      </div>
    </div>
  </div>

  <div class="canvas-container">
    <canvas id="pitch" width="500" height="650"></canvas>
  </div>
  
  <div class="controls">
    <label class="toggle-label" style="background: #333; padding: 8px 12px; border-radius: 5px;">
      <input type="checkbox" id="recordAudio" checked> 🎙️ Include Mic Audio
    </label>
    <button id="recordBtn">Start Recording</button>
    <button id="resetBtn">Reset Positions</button>
  </div>
  
  <div class="toggles">
    <label class="toggle-label"><input type="checkbox" id="toggleCorridors"> Show Corridors (5)</label>
    <label class="toggle-label"><input type="checkbox" id="toggleThirds"> Show Thirds</label>
  </div>

  <div id="status">Ready... Move players around!</div>
  <div class="audio-alert">Click 'Allow' when your browser asks for microphone permissions.</div>

  <script>
    const canvas = document.getElementById('pitch');
    const ctx = canvas.getContext('2d');
    
    const defaultBall = { x: 250, y: 325, color: 'white', type: 'ball', radius: 8 };
    
    const blueRot = Math.PI / 2;
    const redRot = -Math.PI / 2;

    const blueFormations = {
      "9v9_3_4_1": [
        { x: 250, y: 40,  color: 'blue', color2: 'yellow', type: 'GK', rotation: blueRot },
        { x: 125, y: 130, color: 'blue', type: 'LCB', rotation: blueRot },
        { x: 250, y: 110, color: 'blue', type: 'CB', rotation: blueRot },
        { x: 375, y: 130, color: 'blue', type: 'RCB', rotation: blueRot },
        { x: 100, y: 230, color: 'blue', type: 'LM', rotation: blueRot },
        { x: 200, y: 210, color: 'blue', type: 'CM', rotation: blueRot },
        { x: 300, y: 210, color: 'blue', type: 'CM', rotation: blueRot },
        { x: 400, y: 230, color: 'blue', type: 'RM', rotation: blueRot },
        { x: 250, y: 310, color: 'blue', type: 'ST', rotation: blueRot }
      ],
      "9v9_3_3_2": [
        { x: 250, y: 40,  color: 'blue', color2: 'yellow', type: 'GK', rotation: blueRot },
        { x: 125, y: 130, color: 'blue', type: 'LCB', rotation: blueRot },
        { x: 250, y: 110, color: 'blue', type: 'CB', rotation: blueRot },
        { x: 375, y: 130, color: 'blue', type: 'RCB', rotation: blueRot },
        { x: 150, y: 210, color: 'blue', type: 'LCM', rotation: blueRot },
        { x: 250, y: 190, color: 'blue', type: 'CM', rotation: blueRot },
        { x: 350, y: 210, color: 'blue', type: 'RCM', rotation: blueRot },
        { x: 175, y: 300, color: 'blue', type: 'LST', rotation: blueRot },
        { x: 325, y: 300, color: 'blue', type: 'RST', rotation: blueRot }
      ],
      "9v9_2_4_2": [
        { x: 250, y: 40,  color: 'blue', color2: 'yellow', type: 'GK', rotation: blueRot },
        { x: 175, y: 120, color: 'blue', type: 'LCB', rotation: blueRot },
        { x: 325, y: 120, color: 'blue', type: 'RCB', rotation: blueRot },
        { x: 100, y: 230, color: 'blue', type: 'LM', rotation: blueRot },
        { x: 200, y: 210, color: 'blue', type: 'LCM', rotation: blueRot },
        { x: 300, y: 210, color: 'blue', type: 'RCM', rotation: blueRot },
        { x: 400, y: 230, color: 'blue', type: 'RM', rotation: blueRot },
        { x: 175, y: 300, color: 'blue', type: 'LST', rotation: blueRot },
        { x: 325, y: 300, color: 'blue', type: 'RST', rotation: blueRot }
      ],
      "7v7_2_3_1": [
        { x: 250, y: 40,  color: 'blue', color2: 'yellow', type: 'GK', rotation: blueRot },
        { x: 175, y: 120, color: 'blue', type: 'LCB', rotation: blueRot },
        { x: 325, y: 120, color: 'blue', type: 'RCB', rotation: blueRot },
        { x: 125, y: 210, color: 'blue', type: 'LM', rotation: blueRot },
        { x: 250, y: 190, color: 'blue', type: 'CM', rotation: blueRot },
        { x: 375, y: 210, color: 'blue', type: 'RM', rotation: blueRot },
        { x: 250, y: 290, color: 'blue', type: 'ST', rotation: blueRot }
      ]
    };

    const redFormations = {
      "9v9_3_4_1": [
        { x: 250, y: 610, color: 'red', color2: 'yellow', type: 'GK', rotation: redRot },
        { x: 125, y: 520, color: 'red', type: 'LCB', rotation: redRot },
        { x: 250, y: 540, color: 'red', type: 'CB', rotation: redRot },
        { x: 375, y: 520, color: 'red', type: 'RCB', rotation: redRot },
        { x: 100, y: 420, color: 'red', type: 'LM', rotation: redRot },
        { x: 200, y: 440, color: 'red', type: 'CM', rotation: redRot },
        { x: 300, y: 440, color: 'red', type: 'CM', rotation: redRot },
        { x: 400, y: 420, color: 'red', type: 'RM', rotation: redRot },
        { x: 250, y: 340, color: 'red', type: 'ST', rotation: redRot }
      ],
      "9v9_3_3_2": [
        { x: 250, y: 610, color: 'red', color2: 'yellow', type: 'GK', rotation: redRot },
        { x: 125, y: 520, color: 'red', type: 'LCB', rotation: redRot },
        { x: 250, y: 540, color: 'red', type: 'CB', rotation: redRot },
        { x: 375, y: 520, color: 'red', type: 'RCB', rotation: redRot },
        { x: 150, y: 440, color: 'red', type: 'LCM', rotation: redRot },
        { x: 250, y: 460, color: 'red', type: 'CM', rotation: redRot },
        { x: 350, y: 440, color: 'red', type: 'RCM', rotation: redRot },
        { x: 175, y: 350, color: 'red', type: 'LST', rotation: redRot },
        { x: 325, y: 350, color: 'red', type: 'RST', rotation: redRot }
      ],
      "9v9_2_4_2": [
        { x: 250, y: 610, color: 'red', color2: 'yellow', type: 'GK', rotation: redRot },
        { x: 175, y: 530, color: 'red', type: 'LCB', rotation: redRot },
        { x: 325, y: 530, color: 'red', type: 'RCB', rotation: redRot },
        { x: 100, y: 420, color: 'red', type: 'LM', rotation: redRot },
        { x: 200, y: 440, color: 'red', type: 'LCM', rotation: redRot },
        { x: 300, y: 440, color: 'red', type: 'RCM', rotation: redRot },
        { x: 400, y: 420, color: 'red', type: 'RM', rotation: redRot },
        { x: 175, y: 350, color: 'red', type: 'LST', rotation: redRot },
        { x: 325, y: 350, color: 'red', type: 'RST', rotation: redRot }
      ],
      "7v7_2_3_1": [
        { x: 250, y: 610, color: 'red', color2: 'yellow', type: 'GK', rotation: redRot },
        { x: 175, y: 530, color: 'red', type: 'LCB', rotation: redRot },
        { x: 325, y: 530, color: 'red', type: 'RCB', rotation: redRot },
        { x: 125, y: 440, color: 'red', type: 'LM', rotation: redRot },
        { x: 250, y: 460, color: 'red', type: 'CM', rotation: redRot },
        { x: 375, y: 440, color: 'red', type: 'RM', rotation: redRot },
        { x: 250, y: 360, color: 'red', type: 'ST', rotation: redRot }
      ]
    };

    let players = [];
    let draggingPlayer = null;
    let mediaRecorder;
    let recordedChunks = [];
    let isRecording = false;
    let micStream = null;
    let audioCtx = null;

    function buildPlayersArray(resetAll = false) {
      const blueKey = document.getElementById('blueSelect').value;
      const redKey = document.getElementById('redSelect').value;
      const newBlue = JSON.parse(JSON.stringify(blueFormations[blueKey]));
      const newRed = JSON.parse(JSON.stringify(redFormations[redKey]));
      if (resetAll) {
        players = [...newBlue, ...newRed, JSON.parse(JSON.stringify(defaultBall))];
      }
    }

    buildPlayersArray(true);

    document.getElementById('blueSelect').addEventListener('change', function(e) {
      const newBlue = JSON.parse(JSON.stringify(blueFormations[e.target.value]));
      const currentRed = players.filter(p => p.color === 'red');
      const currentBall = players.find(p => p.type === 'ball');
      players = [...newBlue, ...currentRed, currentBall];
      drawPitch();
    });

    document.getElementById('redSelect').addEventListener('change', function(e) {
      const newRed = JSON.parse(JSON.stringify(redFormations[e.target.value]));
      const currentBlue = players.filter(p => p.color === 'blue');
      const currentBall = players.find(p => p.type === 'ball');
      players = [...currentBlue, ...newRed, currentBall];
      drawPitch();
    });

    const toggleCorridors = document.getElementById('toggleCorridors');
    const toggleThirds = document.getElementById('toggleThirds');
    toggleCorridors.addEventListener('change', () => { drawPitch(); });
    toggleThirds.addEventListener('change', () => { drawPitch(); });

    function drawPitch() {
      ctx.fillStyle = '#2E8B57';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)'; 
      ctx.setLineDash([5, 5]); 
      ctx.lineWidth = 1.5;

      if (toggleCorridors.checked) {
        const corridorWidth = canvas.width / 5;
        for (let i = 1; i < 5; i++) {
          ctx.beginPath();
          ctx.moveTo(i * corridorWidth, 0);
          ctx.lineTo(i * corridorWidth, canvas.height);
          ctx.stroke();
        }
      }

      if (toggleThirds.checked) {
        const thirdHeight = canvas.height / 3;
        for (let i = 1; i < 3; i++) {
          ctx.beginPath();
          ctx.moveTo(0, i * thirdHeight);
          ctx.lineTo(canvas.width, i * thirdHeight);
          ctx.stroke();
        }
      }

      ctx.setLineDash([]);
      ctx.strokeStyle = 'white';
      ctx.lineWidth = 2;
      
      ctx.beginPath(); ctx.moveTo(0, canvas.height / 2); ctx.lineTo(canvas.width, canvas.height / 2); ctx.stroke();
      ctx.beginPath(); ctx.arc(canvas.width / 2, canvas.height / 2, 50, 0, Math.PI * 2); ctx.stroke();
      ctx.strokeRect(100, 0, 300, 110);
      ctx.strokeRect(175, 0, 150, 40);
      ctx.beginPath(); ctx.arc(250, 110, 40, 0, Math.PI); ctx.stroke();
      ctx.strokeRect(100, canvas.height - 110, 300, 110);
      ctx.strokeRect(175, canvas.height - 40, 150, 40);
      ctx.beginPath(); ctx.arc(250, canvas.height - 110, 40, Math.PI, 0); ctx.stroke();

      players.forEach(p => {
        let r = p.radius || 12;

        ctx.save();
        ctx.translate(p.x, p.y);
        
        if (p.type !== 'ball' && p.rotation !== undefined) {
          ctx.rotate(p.rotation);
        }

        if (p.color2) {
          ctx.beginPath();
          ctx.arc(0, 0, r, Math.PI, Math.PI * 2); 
          ctx.fillStyle = p.color;
          ctx.fill();

          ctx.beginPath();
          ctx.arc(0, 0, r, 0, Math.PI); 
          ctx.fillStyle = p.color2;
          ctx.fill();
        } else {
          ctx.beginPath();
          ctx.arc(0, 0, r, 0, Math.PI * 2);
          ctx.fillStyle = p.color;
          ctx.fill();
        }

        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.strokeStyle = '#000';
        ctx.lineWidth = p.type === 'ball' ? 1.5 : 2;
        ctx.stroke();

        if (p.type !== 'ball') {
          ctx.beginPath();
          ctx.moveTo(r + 3, 0);
          ctx.lineTo(r - 5, -5);
          ctx.lineTo(r - 5, 5);
          ctx.closePath();
          ctx.fillStyle = 'white';
          ctx.fill();
          ctx.stroke();
        }

        ctx.restore();
      });
    }

    function getPointerPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
    }

    function handleStart(e) {
      e.preventDefault();
      const pos = getPointerPos(e);
      draggingPlayer = players.find(p => {
        const dx = pos.x - p.x;
        const dy = pos.y - p.y;
        return Math.sqrt(dx * dx + dy * dy) < (p.radius || 15) + 10;
      });
    }

    function handleMove(e) {
      if (!draggingPlayer) return;
      e.preventDefault();
      const pos = getPointerPos(e);
      const targetX = Math.max(0, Math.min(canvas.width, pos.x));
      const targetY = Math.max(0, Math.min(canvas.height, pos.y));
      
      if (draggingPlayer.type !== 'ball') {
        const dx = targetX - draggingPlayer.x;
        const dy = targetY - draggingPlayer.y;
        if (Math.hypot(dx, dy) > 1.5) {
          draggingPlayer.rotation = Math.atan2(dy, dx);
        }
      }

      draggingPlayer.x = targetX;
      draggingPlayer.y = targetY;
      drawPitch();
    }

    function handleEnd() { draggingPlayer = null; }

    canvas.addEventListener('mousedown', handleStart);
    canvas.addEventListener('mousemove', handleMove);
    canvas.addEventListener('mouseup', handleEnd);
    canvas.addEventListener('mouseleave', handleEnd);
    canvas.addEventListener('touchstart', handleStart, { passive: false });
    canvas.addEventListener('touchmove', handleMove, { passive: false });
    canvas.addEventListener('touchend', handleEnd);

    // --- HTML5 Native Combined Stream Recording Pipeline ---
    document.getElementById('recordBtn').addEventListener('click', async function() {
      if (isRecording) {
        mediaRecorder.stop();
        if (micStream) {
          micStream.getTracks().forEach(track => track.stop());
          micStream = null;
        }
        if (audioCtx) {
          audioCtx.close();
          audioCtx = null;
        }
        
        this.textContent = 'Start Recording';
        this.classList.remove('recording');
        document.getElementById('status').textContent = 'Video file saved and downloaded!';
        isRecording = false;
      } else {
        const recordAudio = document.getElementById('recordAudio').checked;
        let combinedStream;

        try {
          // 1. Capture canvas stream at 30 FPS
          const canvasStream = canvas.captureStream(30);

          if (recordAudio) {
            // 2. Explicitly trigger browser microphone permission dialog
            micStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
            
            // 3. Setup Web Audio API mixer to combine streams properly
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') {
              await audioCtx.resume();
            }

            const source = audioCtx.createMediaStreamSource(micStream);
            const destination = audioCtx.createMediaStreamDestination();
            
            // Route mic input to the MediaRecorder destination stream
            source.connect(destination);

            // Keep the audio graph alive in Chrome without triggering feedback echo
            const gainNode = audioCtx.createGain();
            gainNode.gain.value = 0; 
            source.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            const videoTrack = canvasStream.getVideoTracks()[0];
            const audioTrack = destination.stream.getAudioTracks()[0];
            
            // 4. Merge video and audio into a single unified stream
            combinedStream = new MediaStream([videoTrack, audioTrack]);
          } else {
            combinedStream = canvasStream;
          }

          let options = { mimeType: 'video/webm;codecs=vp8,opus' };
          if (!MediaRecorder.isTypeSupported(options.mimeType)) {
            options = { mimeType: 'video/webm' };
          }

          mediaRecorder = new MediaRecorder(combinedStream, options);
          recordedChunks = [];

          mediaRecorder.ondataavailable = function(e) {
            if (e.data.size > 0) {
              recordedChunks.push(e.data);
            }
          };

          mediaRecorder.onstop = function() {
            const blob = new Blob(recordedChunks, { type: 'video/webm' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `tactical-animation-with-audio.webm`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
          };

          mediaRecorder.start();
          isRecording = true;
          this.textContent = 'Stop & Save Video';
          this.classList.add('recording');
          document.getElementById('status').textContent = recordAudio ? 'Recording Animation + Mic Audio... Speak now!' : 'Recording Video... Move players!';
          drawPitch();

        } catch (err) {
          console.error("Microphone access error:", err);
          alert("Microphone permission was blocked or denied. Please check your browser address bar permissions and ensure you are running this via Localhost or HTTPS.");
        }
      }
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      buildPlayersArray(true);
      drawPitch();
    });

    drawPitch();
  </script>
</body>
</html>
