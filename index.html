<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vertical Soccer Tactics Animator</title>
  <style>
    body { font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; background: #1a1a1a; color: white; padding: 20px; margin: 0; min-height: 100vh; box-sizing: border-box; }
    .header-bar { display: flex; flex-direction: column; align-items: center; margin-bottom: 10px; }
    .team-selectors { display: flex; gap: 20px; margin-bottom: 10px; flex-wrap: wrap; justify-content: center; }
    .selector-group { display: flex; flex-direction: column; align-items: center; font-weight: bold; }
    .selector-group.blue { color: #66b3ff; }
    .selector-group.red { color: #ff6666; }
    select { margin-top: 5px; padding: 6px 10px; font-size: 15px; border-radius: 5px; background: #333; color: white; border: 1px solid #555; cursor: pointer; }
    .canvas-container { width: 90vw; max-width: 700px; aspect-ratio: 50 / 65; position: relative; }
    canvas { width: 100%; height: 100%; border: 2px solid #fff; border-radius: 5px; cursor: grab; touch-action: none; background: #2E8B57; display: block; }
    canvas:active { cursor: grabbing; }
    .controls { margin-top: 15px; display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; align-items: center; }
    .toggles { margin-top: 10px; display: flex; gap: 20px; font-size: 0.95em; color: #ddd; flex-wrap: wrap; justify-content: center; }
    label.toggle-label { display: flex; align-items: center; gap: 5px; cursor: pointer; color: white; font-weight: normal; }
    button { padding: 10px 15px; border: none; border-radius: 5px; background: #007bff; color: white; cursor: pointer; font-weight: bold; }
    button:hover { background: #0056b3; }
    button.recording { background: #dc3545; animation: pulse 1s infinite; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }
    #legend { margin-top: 15px; font-size: 0.9em; color: #ddd; display: flex; gap: 15px; }
    .legend-item { display: flex; align-items: center; gap: 5px; }
    .dash-yellow { width: 20px; height: 3px; background: repeating-linear-gradient(90deg, #ffeb3b, #ffeb3b 6px, transparent 6px, transparent 10px); }
    .dash-cyan { width: 20px; height: 3px; background: repeating-linear-gradient(90deg, #00e5ff, #00e5ff 3px, transparent 3px, transparent 6px); }
  </style>
</head>
<body>

  <div class="header-bar">
    <h2>Tactical Board</h2>
    <div class="team-selectors">
      <div class="selector-group blue">
        Blue Team (Top)
        <select id="blueSelect">
          <option value="9v9_3_4_1" selected>9v9 (3-4-1)</option>
          <option value="7v7_2_3_1">7v7 (2-3-1)</option>
        </select>
      </div>
      <div class="selector-group red">
        Red Team (Bottom)
        <select id="redSelect">
          <option value="9v9_3_4_1" selected>9v9 (3-4-1)</option>
          <option value="7v7_2_3_1">7v7 (2-3-1)</option>
        </select>
      </div>
    </div>
  </div>

  <div class="canvas-container">
    <canvas id="pitch" width="500" height="650"></canvas>
  </div>
  
  <div class="controls">
    <label class="toggle-label" style="background: #333; padding: 8px 12px; border-radius: 5px;">
      <input type="checkbox" id="recordAudio" checked> 🎙️ Mic
    </label>
    <label class="toggle-label" style="background: #ff9800; color: #000; font-weight: bold; padding: 8px 12px; border-radius: 5px;">
      <input type="checkbox" id="toggleOptimalPlay"> 🔍 Visa Bästa Uppspel
    </label>
    <button id="recordBtn">Start Recording</button>
    <button id="resetBtn" style="background: #555;">Reset Positions</button>
  </div>
  
  <div class="toggles">
    <label class="toggle-label"><input type="checkbox" id="toggleCorridors"> Show Corridors (5)</label>
    <label class="toggle-label"><input type="checkbox" id="toggleThirds"> Show Thirds</label>
  </div>

  <div id="legend">
    <div class="legend-item"><div class="dash-yellow"></div> = Passning</div>
    <div class="legend-item"><div class="dash-cyan"></div> = Driva boll</div>
  </div>

  <script>
    const canvas = document.getElementById('pitch');
    const ctx = canvas.getContext('2d');
    const defaultBall = { x: 250, y: 325, color: 'white', type: 'ball', radius: 8 };
    const blueRot = Math.PI / 2;
    const redRot = -Math.PI / 2;
    
    const blueFormations = {
      "9v9_3_4_1": [ { x: 250, y: 40, color: 'blue', color2: 'yellow', type: 'GK', rotation: blueRot }, { x: 125, y: 130, color: 'blue', type: 'LCB', rotation: blueRot }, { x: 250, y: 110, color: 'blue', type: 'CB', rotation: blueRot }, { x: 375, y: 130, color: 'blue', type: 'RCB', rotation: blueRot }, { x: 50, y: 230, color: 'blue', type: 'LM', rotation: blueRot }, { x: 200, y: 210, color: 'blue', type: 'CM', rotation: blueRot }, { x: 300, y: 210, color: 'blue', type: 'CM', rotation: blueRot }, { x: 450, y: 230, color: 'blue', type: 'RM', rotation: blueRot }, { x: 250, y: 310, color: 'blue', type: 'ST', rotation: blueRot } ],
      "7v7_2_3_1": [ { x: 250, y: 40, color: 'blue', color2: 'yellow', type: 'GK', rotation: blueRot }, { x: 175, y: 120, color: 'blue', type: 'LCB', rotation: blueRot }, { x: 325, y: 120, color: 'blue', type: 'RCB', rotation: blueRot }, { x: 125, y: 210, color: 'blue', type: 'LM', rotation: blueRot }, { x: 250, y: 190, color: 'blue', type: 'CM', rotation: blueRot }, { x: 375, y: 210, color: 'blue', type: 'RM', rotation: blueRot }, { x: 250, y: 290, color: 'blue', type: 'ST', rotation: blueRot } ]
    };

    const redFormations = {
      "9v9_3_4_1": [ { x: 250, y: 610, color: 'red', color2: 'yellow', type: 'GK', rotation: redRot }, { x: 125, y: 520, color: 'red', type: 'LCB', rotation: redRot }, { x: 250, y: 540, color: 'red', type: 'CB', rotation: redRot }, { x: 375, y: 520, color: 'red', type: 'RCB', rotation: redRot }, { x: 50, y: 420, color: 'red', type: 'LM', rotation: redRot }, { x: 200, y: 440, color: 'red', type: 'CM', rotation: redRot }, { x: 300, y: 440, color: 'red', type: 'CM', rotation: redRot }, { x: 450, y: 420, color: 'red', type: 'RM', rotation: redRot }, { x: 250, y: 340, color: 'red', type: 'ST', rotation: redRot } ],
      "7v7_2_3_1": [ { x: 250, y: 610, color: 'red', color2: 'yellow', type: 'GK', rotation: redRot }, { x: 175, y: 530, color: 'red', type: 'LCB', rotation: redRot }, { x: 325, y: 530, color: 'red', type: 'RCB', rotation: redRot }, { x: 125, y: 440, color: 'red', type: 'LM', rotation: redRot }, { x: 250, y: 460, color: 'red', type: 'CM', rotation: redRot }, { x: 375, y: 440, color: 'red', type: 'RM', rotation: redRot }, { x: 250, y: 360, color: 'red', type: 'ST', rotation: redRot } ]
    };

    let players = [];
    let draggingPlayer = null;
    let bestPath = [];
    let maxEV = 0;

    function buildPlayersArray() {
      const blueKey = document.getElementById('blueSelect').value;
      const redKey = document.getElementById('redSelect').value;
      players = [...JSON.parse(JSON.stringify(blueFormations[blueKey])), ...JSON.parse(JSON.stringify(redFormations[redKey])), JSON.parse(JSON.stringify(defaultBall))];
      updateOptimalPlay();
      drawPitch();
    }

    function updateOptimalPlay() {
      if (document.getElementById('toggleOptimalPlay').checked) {
        calculateOptimalPlay();
      } else {
        bestPath = [];
      }
    }

    document.getElementById('blueSelect').addEventListener('change', () => { buildPlayersArray(); });
    document.getElementById('redSelect').addEventListener('change', () => { buildPlayersArray(); });
    document.getElementById('toggleCorridors').addEventListener('change', drawPitch);
    document.getElementById('toggleThirds').addEventListener('change', drawPitch);
    document.getElementById('resetBtn').addEventListener('click', () => { buildPlayersArray(); });
    
    document.getElementById('toggleOptimalPlay').addEventListener('change', () => {
      updateOptimalPlay();
      drawPitch();
    });

    // --- ALGORITMEN ---
    function calculateOptimalPlay() {
      bestPath = [];
      maxEV = -1;
      
      const ball = players.find(p => p.type === 'ball');
      const outfielders = players.filter(p => p.type !== 'ball');
      
      let carrier = null, minDist = Infinity;
      outfielders.forEach(p => {
        let d = Math.hypot(p.x - ball.x, p.y - ball.y);
        if(d < minDist) { minDist = d; carrier = p; }
      });
      
      if(!carrier || minDist > 40) return;
      
      const attTeam = carrier.color;
      const attackers = outfielders.filter(p => p.color === attTeam);
      const defenders = outfielders.filter(p => p.color !== attTeam);
      const attackDir = (attTeam === 'blue') ? 1 : -1; 
      
      const getXT = (p) => {
        let val = (attTeam === 'blue') ? (p.y / 650) : ((650 - p.y) / 650);
        return Math.pow(val, 2) * 0.3; 
      };
      
      const getActionProb = (from, to, type) => {
        let prob = (type === 'pass') ? 0.90 : 0.85;
        let dist = Math.hypot(to.x - from.x, to.y - from.y);
        
        if (type === 'pass') prob -= (dist / 1000); 
        
        let blocked = false;
        defenders.forEach(d => {
          const l2 = dist * dist;
          if (l2 === 0) return;
          const t = Math.max(0, Math.min(1, ((d.x - from.x) * (to.x - from.x) + (d.y - from.y) * (to.y - from.y)) / l2));
          const projX = from.x + t * (to.x - from.x);
          const projY = from.y + t * (to.y - from.y);
          const distToLine = Math.hypot(d.x - projX, d.y - projY);
          
          if(distToLine < 20) {
            blocked = true; 
          } else if(distToLine < 40) {
            prob *= (type === 'pass') ? 0.4 : 0.2; 
          } else if(distToLine < 70) {
            prob *= 0.8;
          }
        });
        
        if (blocked) return 0.0;
        return Math.max(0, prob);
      };

      // --- DFS SÖKTRÄD ---
      function searchTree(node, currentProb, path, depth, currentPlayer) {
        let ev = currentProb * getXT(node);
        if (ev > maxEV && path.length > 1) {
            maxEV = ev;
            bestPath = [...path];
        }
        
        // Ökat till 4 aktioner
        if (depth >= 4) return; 

        // 1. Passningsalternativ
        attackers.forEach(mate => {
          if (mate === currentPlayer) return; 
          
          // Förhindra att man passar till någon som redan haft bollen i kedjan
          let alreadyHadBall = path.some(n => (n.player || n) === mate);
          if (alreadyHadBall) return;

          let pProb = getActionProb(node, mate, 'pass');
          if (pProb > 0.05) { 
            searchTree(mate, currentProb * pProb, [...path, mate], depth + 1, mate);
          }
        });

        // 2. Alternativ för att driva bollen (Finmaskigt nät)
        let driveDistances = [45, 90]; // Kort eller lång drivning
        let driveAngles = [-0.5, 0, 0.5]; // Snett vänster, rakt fram, snett höger (radianer)
        
        let baseAngle = (attackDir === 1) ? Math.PI/2 : -Math.PI/2;

        driveDistances.forEach(dist => {
          driveAngles.forEach(angle => {
            let moveAngle = baseAngle + angle;
            let newX = node.x + Math.cos(moveAngle) * dist;
            let newY = node.y + Math.sin(moveAngle) * dist;
            
            // Håll drivningen innanför linjerna
            if (newY > 15 && newY < 635 && newX > 15 && newX < 485) {
              // Spara currentPlayer i den nya noden så vi vet vem som har bollen efter drivningen
              let drivaNode = { x: newX, y: newY, isDriva: true, player: currentPlayer };
              let dProb = getActionProb(node, drivaNode, 'driva');
              
              if (dProb > 0.2) {
                searchTree(drivaNode, currentProb * dProb, [...path, drivaNode], depth + 1, currentPlayer);
              }
            }
          });
        });
      }
      
      // Starta sökningen: (Nuvarande nod, sannolikhet, sökväg, djup, nuvarande spelare)
      searchTree(carrier, 1.0, [carrier], 0, carrier);
    }

    function drawPitch() {
      ctx.fillStyle = '#2E8B57'; ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)'; ctx.setLineDash([5, 5]); ctx.lineWidth = 1.5;

      if (document.getElementById('toggleCorridors').checked) {
        for (let i = 1; i < 5; i++) { ctx.beginPath(); ctx.moveTo(i * (canvas.width / 5), 0); ctx.lineTo(i * (canvas.width / 5), canvas.height); ctx.stroke(); }
      }
      if (document.getElementById('toggleThirds').checked) {
        for (let i = 1; i < 3; i++) { ctx.beginPath(); ctx.moveTo(0, i * (canvas.height / 3)); ctx.lineTo(canvas.width, i * (canvas.height / 3)); ctx.stroke(); }
      }

      ctx.setLineDash([]); ctx.strokeStyle = 'white'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(0, canvas.height / 2); ctx.lineTo(canvas.width, canvas.height / 2); ctx.stroke();
      ctx.beginPath(); ctx.arc(canvas.width / 2, canvas.height / 2, 50, 0, Math.PI * 2); ctx.stroke();
      ctx.strokeRect(100, 0, 300, 110); ctx.strokeRect(175, 0, 150, 40);
      ctx.beginPath(); ctx.arc(250, 110, 40, 0, Math.PI); ctx.stroke();
      ctx.strokeRect(100, canvas.height - 110, 300, 110); ctx.strokeRect(175, canvas.height - 40, 150, 40);
      ctx.beginPath(); ctx.arc(250, canvas.height - 110, 40, Math.PI, 0); ctx.stroke();

      // RITA UPP DEN OPTIMALA RUTTEN
      if(bestPath && bestPath.length > 1) {
        for(let i = 1; i < bestPath.length; i++) {
          ctx.beginPath();
          ctx.lineWidth = 3;
          if (bestPath[i].isDriva) {
            ctx.strokeStyle = '#00e5ff'; 
            ctx.setLineDash([3, 4]);
          } else {
            ctx.strokeStyle = '#ffeb3b'; 
            ctx.setLineDash([10, 6]);
          }
          ctx.moveTo(bestPath[i-1].x, bestPath[i-1].y);
          ctx.lineTo(bestPath[i].x, bestPath[i].y);
          ctx.stroke();
        }
        ctx.setLineDash([]);
        
        let lastNode = bestPath[bestPath.length - 1];
        let evText = "xT: " + (maxEV * 100).toFixed(1) + "%";
        
        ctx.font = 'bold 16px system-ui';
        let textWidth = ctx.measureText(evText).width;
        
        ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
        ctx.fillRect(lastNode.x - (textWidth/2) - 8, lastNode.y - 35, textWidth + 16, 26);
        
        ctx.fillStyle = '#4caf50'; 
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(evText, lastNode.x, lastNode.y - 22);
      }

      players.forEach(p => {
        if(p.isDriva) return; 
        let r = p.radius || 12;
        ctx.save(); ctx.translate(p.x, p.y);
        if (p.type !== 'ball' && p.rotation !== undefined) ctx.rotate(p.rotation);
        
        ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fillStyle = p.color; ctx.fill();
        if (p.color2) { ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI); ctx.fillStyle = p.color2; ctx.fill(); }
        
        ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.strokeStyle = '#000'; ctx.lineWidth = p.type === 'ball' ? 1.5 : 2; ctx.stroke();
        if (p.type !== 'ball') {
          ctx.beginPath(); ctx.moveTo(r + 3, 0); ctx.lineTo(r - 5, -5); ctx.lineTo(r - 5, 5); ctx.closePath();
          ctx.fillStyle = 'white'; ctx.fill(); ctx.stroke();
        }
        ctx.restore();
      });
    }

    function getPointerPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
    }

    function handleStart(e) {
      e.preventDefault();
      const pos = getPointerPos(e);
      draggingPlayer = players.find(p => Math.hypot(pos.x - p.x, pos.y - p.y) < (p.radius || 15) + 10);
    }

    function handleMove(e) {
      if (!draggingPlayer) return;
      e.preventDefault();
      const pos = getPointerPos(e);
      draggingPlayer.x = Math.max(0, Math.min(canvas.width, pos.x));
      draggingPlayer.y = Math.max(0, Math.min(canvas.height, pos.y));
      if (draggingPlayer.type !== 'ball' && Math.hypot(pos.x - draggingPlayer.x, pos.y - draggingPlayer.y) > 1.5) {
        draggingPlayer.rotation = Math.atan2(pos.y - draggingPlayer.y, pos.x - draggingPlayer.x);
      }
      
      updateOptimalPlay();
      drawPitch();
    }

    canvas.addEventListener('mousedown', handleStart); canvas.addEventListener('mousemove', handleMove);
    canvas.addEventListener('mouseup', () => draggingPlayer = null); canvas.addEventListener('mouseleave', () => draggingPlayer = null);
    canvas.addEventListener('touchstart', handleStart, { passive: false }); canvas.addEventListener('touchmove', handleMove, { passive: false });
    canvas.addEventListener('touchend', () => draggingPlayer = null);

    buildPlayersArray();
  </script>
</body>
</html>
